# Local deployment: isolated names and ports; automatically loaded by Compose.
name: interview-submit

services:
  # Include the employment module in ordinary `docker compose up` deployments.
  # Keep its definitions in one file; its MySQL data volume is independent.
  course-mysql:
    extends:
      file: docker-compose.employment.yml
      service: course-mysql
  course-app:
    extends:
      file: docker-compose.employment.yml
      service: course-app
  postgres:
    container_name: interview-submit-postgres
    restart: unless-stopped
    ports: !override
      - "127.0.0.1:15434:5432"
  redis:
    container_name: interview-submit-redis
    restart: unless-stopped
    ports: !override
      - "127.0.0.1:16381:6379"
  minio:
    image: interview-submit-minio:local
    build:
      context: ./docker/minio
      target: server
    container_name: interview-submit-minio
    restart: unless-stopped
    ports: !override
      - "127.0.0.1:19004:9000"
      - "127.0.0.1:19005:9001"
  createbuckets:
    image: interview-submit-mc:local
    build:
      context: ./docker/minio
      target: client
    entrypoint:
      - /bin/sh
      - -ec
      - |
        mc alias set myminio http://minio:9000 minioadmin minioadmin
        mc mb myminio/interview-guide --ignore-existing
        mc anonymous set public myminio/interview-guide
  app:
    container_name: interview-submit-app
    restart: unless-stopped
    environment:
      # Allows startup without a real key. AI calls require a valid key in .env.
      AI_API_KEY: ${AI_API_KEY:-${AI_GEMINI_API_KEY:-${AI_BAILIAN_API_KEY:-local-key-not-configured}}}
      APP_ADMIN_USERNAME: ${APP_ADMIN_USERNAME:-}
      APP_ADMIN_PASSWORD: ${APP_ADMIN_PASSWORD:-}
      CORS_ALLOWED_ORIGINS: http://localhost:18181,http://127.0.0.1:18181
    networks:
      default:
        aliases:
          - interview-app
    ports: !override
      - "127.0.0.1:18182:8080"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/api/resumes/health"]
      start_period: 120s
      interval: 15s
      timeout: 5s
      retries: 5

  frontend:
    container_name: interview-submit-frontend
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports: !override
      - "18181:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 15s
      timeout: 5s
      retries: 5

volumes:
  employment_mysql_data:

