server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Allow larger file uploads
    client_max_body_size 50M;

    # The SPA route shares its name with the public illustration directory.
    # Serve the app directly, avoiding a directory redirect to container port 80.
    location = /community {
        try_files /index.html =404;
    }

    location = /community/ {
        try_files /index.html =404;
    }

    location ^~ /community/examples/ {
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Resolve the optional module only when requested, so its outage cannot prevent Nginx startup.
    location ^~ /api/course/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $employment_upstream course-app:8080;
        proxy_pass http://$employment_upstream$request_uri;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_connect_timeout 3s;
        proxy_read_timeout 30s;
        proxy_buffering off;
        proxy_intercept_errors on;
        error_page 502 503 504 =503 @employment_unavailable;
        add_header Cache-Control "no-store" always;
    }

    location @employment_unavailable {
        default_type application/json;
        add_header Cache-Control "no-store" always;
        return 503 '{"code":503,"message":"就业服务暂不可用，请稍后点击重新连接","data":null}';
    }

    location /api/ {
        proxy_pass http://interview-app:8080;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE / 流式响应优化：关闭代理缓冲，避免 Cloudflare Tunnel 提前断开
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;
        add_header X-Accel-Buffering no;
        
        # Increase timeout for long-running AI requests
        proxy_read_timeout 300s;
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
    }
}
